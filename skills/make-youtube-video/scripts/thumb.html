<!doctype html>
<html><head><meta charset="utf-8"><style>
:root{--accent:#7cf29c;--bg:#0d1117;--fg:#ffffff}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:720px;overflow:hidden;background:var(--bg);font-family:"Inter","Noto Sans","DejaVu Sans",sans-serif}
#bg{position:absolute;inset:0;background-size:cover;background-position:center}
#shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.88) 0%,rgba(0,0,0,.6) 55%,rgba(0,0,0,.05) 100%)}
#t{position:absolute;left:64px;top:50%;transform:translateY(-50%);width:760px;color:var(--fg);font-weight:900;
  font-size:104px;line-height:1.0;letter-spacing:-.02em;text-transform:uppercase;text-shadow:0 6px 24px rgba(0,0,0,.6)}
#t em{font-style:normal;color:var(--accent)}
#badge{position:absolute;right:56px;bottom:56px;background:var(--accent);color:#0d1117;font-weight:900;font-size:64px;
  padding:14px 28px;border-radius:18px;transform:rotate(-3deg);box-shadow:0 10px 30px rgba(0,0,0,.5)}
#badge:empty{display:none}
</style></head><body><div id="bg"></div><div id="shade"></div><div id="t"></div><div id="badge"></div>
<script>
const esc=t=>String(t??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
window.show=function(sc,beat,o){
  document.getElementById("t").innerHTML=esc(o.text).replace(/\*([^*]+)\*/g,"<em>$1</em>");
  document.getElementById("badge").textContent=o.badge||"";
  if(o.bgUrl) document.getElementById("bg").style.backgroundImage=`url("${o.bgUrl}")`;
  if(o.vars) for(const [k,v] of Object.entries(o.vars)) document.documentElement.style.setProperty(k,v);
};
</script></body></html>
